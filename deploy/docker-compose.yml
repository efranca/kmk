name: kmk

# app.kmk-entretien.ca: Caddy on 127.0.0.1:8081, reached through the existing Cloudflare Tunnel
# (Zero Trust public hostname -> http://localhost:8081). Independent of famillai.
#
# Secrets come from deploy/.env (git-ignored). Each service lists exactly the variables it needs, so the long-running
# API never receives the database OWNER credentials (MIGRATION_DATABASE_URL): only the one-shot `migrate` service does.
# A new setting for the API has to be added to the `api` environment below to reach it.

services:
  migrate:
    build:
      context: ../backend
      # Shown by GET /api/version (Settings > About); auto-deploy exports them, a manual build leaves them empty.
      args:
        APP_COMMIT: ${APP_COMMIT:-}
        APP_COMMIT_COUNT: ${APP_COMMIT_COUNT:-}
        APP_BUILT_AT: ${APP_BUILT_AT:-}
    image: kmk-backend
    pull_policy: build
    container_name: kmk-migrate
    restart: "no"
    network_mode: host   # reaches the shared Postgres on 127.0.0.1:5432
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  api:
    build: ../backend
    image: kmk-backend
    pull_policy: build
    container_name: kmk-api
    restart: unless-stopped
    network_mode: host   # reaches the shared Postgres on 127.0.0.1:5432; listens on 127.0.0.1:8001 only
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      API_HOST: ${API_HOST:-127.0.0.1}
      API_PORT: ${API_PORT:-8001}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-log}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: "${EMAIL_FROM:-KMK Entretien <no-reply@mail.kmk-entretien.ca>}"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://app.kmk-entretien.ca}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      MFA_REQUIRED_ROLES: ${MFA_REQUIRED_ROLES:-}
    mem_limit: 1536m       # Argon2 uses 64 MiB per call (at most 4 at once); a 50 MB document upload holds a few copies (at most 2 at once)
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:   # keep log files bounded: 5 files of 10 MB at most per container
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2.10.2
    container_name: kmk-caddy
    restart: unless-stopped
    network_mode: host
    depends_on:
      - api
    mem_limit: 512m
    pids_limit: 256
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]   # the caddy binary carries this file capability: without it the container cannot even start
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header='Host: app.kmk-entretien.ca' http://127.0.0.1:8081/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend/dist:/srv/site:ro
      - caddy_data:/data

volumes:
  caddy_data:
    name: kmk_caddy_data
