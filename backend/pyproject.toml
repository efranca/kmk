[project]
name = "kmk-api"
version = "0.5.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "argon2-cffi>=23",
  "httpx>=0.27",
  "pyotp>=2.9",
  "cryptography>=43",
  "python-dateutil>=2.9",
  "pywebpush>=2.0",
  "fpdf2>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pip-audit>=2.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["invoices/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs real pg_dump/gpg (backup scripts); skip with -m \"not slow\""]
